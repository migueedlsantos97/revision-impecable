<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumen</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#17181a;--ink2:#4a4d52;--line:#d9dbe0;--accent:#b3122f}
[data-theme=dark]{--bg:#101113;--card:#1b1c1f;--ink:#f1f2f4;--ink2:#b4b7bd;--line:#33353a;--accent:#ff5470}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
header{position:relative;height:64px;background:var(--card);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center}
header strong{font-size:20px;white-space:nowrap}
.tema{position:absolute;right:16px;top:10px;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font:inherit;padding:0 14px;width:230px;text-align:center}
h1{font-size:22px;margin:20px 16px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card small{display:block;font-size:14px;color:#aaaaaa}
.card b{font-size:28px;display:block}
.aviso{margin:12px 16px;padding:14px 16px;border-radius:14px;background:#fff3cd;color:#111}
.card.nota{color:#111}
ul{list-style:none;margin:0;padding:0}
li{padding:12px 0;border-top:1px solid var(--line);font-size:17px}
li:first-child{border-top:0}
</style>
</head>
<body>
<header>
  <strong>TALLER · Resumen del día</strong>
  <button class="tema" type="button" aria-label="Cambiar tema" onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'">Cambiar tema</button>
</header>
<h1>Hoy entraron 2 recepciones y salió 1 baja.</h1>
<div class="aviso">⚠️ 3 alertas de stock requieren atención</div>
<div class="grid">
  <div class="card"><small>Recepciones</small><b>2</b></div>
  <div class="card"><small>Bajas</small><b>1</b></div>
  <div class="card nota"><small>Nota del encargado</small>Revisar sector E antes del viernes.</div>
</div>
<section class="card" style="margin:12px 16px">
  <ul>
    <li>Alerta: perfil 1321 bajo mínimo</li>
  </ul>
</section>
</body>
</html>
