<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Repetido</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  @font-face { font-family: Roto; src: url(/no-existe.woff2) format("woff2"); }
  .roto { font-family: Roto, sans-serif; }
  .corto { width: 60px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .caja { position: relative; width: 120px; height: 60px; }
  .caja .tapa { position: absolute; inset: 0; background: rgba(200, 0, 0, .4); }
  button, input { min-height: 48px; } .g { width: 40px; height: 40px; }
</style>
</head>
<body>
<!-- sin lang, sin viewport: dos defectos de documento -->
<h1>Uno</h1><h1>Otro h1</h1>
<h4>Salta de h1 a h4</h4>
<img class="g" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<img src="/nope.png" alt="rota con url" width="5" height="5">
<input placeholder="Solo placeholder">
<button style="width:50px;height:50px"></button>
<div id="repe">a</div><div id="repe">b</div>
<div tabindex="0" aria-labelledby="no-existe" style="min-height:48px">aria roto</div>
<div tabindex="3" style="min-height:48px">tabindex positivo</div>
<a href="#" style="display:inline-block;min-height:48px;min-width:48px">falso</a>
<div class="corto">Un texto largo que se corta con puntos suspensivos</div>
<p class="roto">Texto con la fuente que no carga</p>
<div class="caja"><button style="width:100px;height:50px">Tapado</button><div class="tapa"></div></div>
<button style="min-width:48px">&times;</button>
<script>setTimeout(function () { var d = document.createElement('div'); d.style.height = '400px'; d.textContent = 'entra tarde'; document.body.prepend(d); }, 150);</script>
</body>
</html>
